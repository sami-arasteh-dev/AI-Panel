<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>AI Panel - پنل هوشمند</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
<style>
    body {
        font-family: Vazirmatn, Tahoma, sans-serif;
        background: #0f172a;
        color: #e5e7eb;
        margin: 0;
        padding: 20px;
    }
    .container-main {
        max-width: 1100px;
        margin: auto;
        background: #020617;
        padding: 20px;
        border-radius: 12px;
        border: 1px solid #334155;
    }
    .auth-box {
        max-width: 400px;
        margin: 100px auto;
        background: #1e293b;
        padding: 30px;
        border-radius: 12px;
    }
    input, textarea, select, button {
        background: #0f172a !important;
        color: #e5e7eb !important;
        border: 1px solid #334155 !important;
        border-radius: 6px;
    }
    input:focus, textarea:focus, select:focus {
        border-color: #2563eb !important;
        box-shadow: none !important;
        outline: none;
    }
    button.btn-primary { background: #2563eb; border: none; }
    button.btn-primary:hover { background: #1d4ed8; }

    .nav-tabs .nav-link { color: #94a3b8; border: none; border-bottom: 2px solid transparent; }
    .nav-tabs .nav-link.active { background: transparent; color: #38bdf8; border-bottom: 2px solid #38bdf8; }

    .chat-bubble {
        padding: 12px 16px;
        border-radius: 12px;
        margin-bottom: 15px;
        max-width: 90%;
        white-space: pre-wrap;
        word-wrap: break-word;
        font-size: 0.95rem;
        line-height: 1.65;
        position: relative;
    }
    .chat-user {
        background: #2563eb;
        color: #fff;
        margin-right: auto;
        margin-left: 0;
        border-bottom-left-radius: 4px;
    }
    .chat-ai {
        background: #1e293b;
        color: #e5e7eb;
        margin-left: auto;
        margin-right: 0;
        border-bottom-right-radius: 4px;
        border: 1px solid #334155;
    }

    /* نمایش کد به صورت خوانا */
    .chat-bubble pre {
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 12px;
        margin: 10px 0;
        overflow-x: auto;
        direction: ltr;
        text-align: left;
        font-family: 'Fira Code', 'Consolas', monospace;
        font-size: 0.88rem;
        line-height: 1.5;
    }
    .chat-bubble code {
        font-family: 'Fira Code', 'Consolas', monospace;
        background: #0f172a;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 0.9em;
    }

    .chat-container {
        height: 480px;
        overflow-y: auto;
        padding: 15px;
        background: #0f172a;
        border-radius: 8px;
        border: 1px solid #334155;
        margin-bottom: 15px;
    }

    .history-item {
        cursor: pointer;
        padding: 12px 14px;
        border-bottom: 1px solid #334155;
        transition: 0.2s;
        border-radius: 6px;
    }
    .history-item:hover { background: #1e293b; }

    .copy-btn {
        position: absolute;
        top: 8px;
        left: 8px;
        font-size: 0.75rem;
        padding: 2px 8px;
        opacity: 0.6;
    }
    .chat-bubble:hover .copy-btn { opacity: 1; }
</style>
</head>
<body>

{% if not logged_in %}
<div class="auth-box text-center shadow">
    <h3 class="mb-4 text-white">ورود به پنل هوش مصنوعی</h3>
    <input type="text" id="username" class="form-control mb-3" placeholder="نام کاربری">
    <input type="password" id="password" class="form-control mb-3" placeholder="رمز عبور">
    <button class="btn btn-primary w-100 mb-2" onclick="auth('login')">ورود</button>
    <button class="btn btn-outline-info w-100" onclick="auth('register')">ثبت‌نام (بار اول)</button>
</div>
{% else %}
<div class="container-main shadow">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary pb-3">
        <h3 class="m-0 text-white">🧠 پنل هوشمند — خوش آمدی {{ username }}!</h3>
        <a href="/logout" class="btn btn-sm btn-danger">خروج</a>
    </div>

    <ul class="nav nav-tabs mb-4" id="mainTabs">
        <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#chatTab" onclick="startNewChat()">💬 چت</a></li>
        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#historyTab" onclick="loadHistory()">📜 سوابق</a></li>
        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#settingsTab" onclick="loadSettings()">⚙️ تنظیمات</a></li>
    </ul>

    <div class="tab-content">
        <!-- چت -->
        <div class="tab-pane fade show active" id="chatTab">
            <div id="chatBox" class="chat-container">
                <div class="text-center text-muted mt-5">یک پیام بنویسید تا گفتگو آغاز شود...</div>
            </div>
           
            <div class="d-flex gap-2 align-items-end">
                <input type="file" id="chatFile" class="form-control" style="max-width: 180px;" accept=".txt,.csv,.md,.json,.py,.js,.html,.css">
                <textarea id="chatInput" class="form-control" rows="2" placeholder="پیام خود را بنویسید... (کد HTML هم به صورت متن نمایش داده می‌شود)"></textarea>
                <button class="btn btn-primary px-4" onclick="sendMessage()">ارسال 🚀</button>
            </div>
        </div>

        <!-- سوابق -->
        <div class="tab-pane fade" id="historyTab">
            <input type="text" id="searchHistory" class="form-control mb-3" placeholder="🔍 جستجوی زنده در سوابق..." onkeyup="searchLive()">
            <div id="historyList" class="bg-dark rounded p-2" style="max-height: 450px; overflow-y: auto;"></div>
        </div>

        <!-- تنظیمات -->
        <div class="tab-pane fade" id="settingsTab">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label text-info">🔑 API Key</label>
                    <input type="text" id="set_api_key" class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label text-info">🤖 مدل هوش مصنوعی</label>
                    <select id="set_model" class="form-select">
                        <optgroup label="GapGPT">
                            <option value="gapgpt-qwen-3.5">gapgpt-qwen-3.5</option>
                            <option value="gapgpt-qwen-3.6">gapgpt-qwen-3.6</option>
                        </optgroup>
                        <optgroup label="OpenAI">
                            <option value="gpt-4o" selected>gpt-4o</option>
                            <option value="gpt-4o-mini">gpt-4o-mini</option>
                            <option value="gpt-4.5-preview">gpt-4.5-preview</option>
                            <option value="o3-mini">o3-mini</option>
                        </optgroup>
                        <optgroup label="Anthropic">
                            <option value="claude-3-5-sonnet-20241022">claude-3-5-sonnet-20241022</option>
                            <option value="claude-3-7-sonnet-20250219">claude-3-7-sonnet-20250219</option>
                        </optgroup>
                        <optgroup label="Google">
                            <option value="gemini-2.5-flash">gemini-2.5-flash</option>
                            <option value="gemini-3.1-pro-preview">gemini-3.1-pro-preview</option>
                        </optgroup>
                        <optgroup label="Deepseek">
                            <option value="deepseek-r1">deepseek-r1</option>
                            <option value="deepseek-v4-pro">deepseek-v4-pro</option>
                        </optgroup>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label text-info">🧠 حافظه گفتگو (۱ تا ۵)</label>
                    <input type="number" id="set_memory" class="form-control" min="1" max="5" value="5">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label text-info">🌡️ دمای پاسخ (0 تا 2)</label>
                    <input type="number" id="set_temp" class="form-control" step="0.1" min="0" max="2" value="0.7">
                </div>
                <div class="col-12 mb-3">
                    <label class="form-label text-info">📜 دستورالعمل (Instruction)</label>
                    <textarea id="set_inst" class="form-control" rows="2"></textarea>
                </div>
                <div class="col-12 mb-3">
                    <label class="form-label text-info">📄 دانش زمینه (Base Context)</label>
                    <textarea id="set_base" class="form-control" rows="3"></textarea>
                </div>
                <div class="col-12 text-end">
                    <button class="btn btn-success px-5" onclick="saveSettings()">ذخیره تنظیمات 💾</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endif %}

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let currentConvId = null;

    // ========== تابع حیاتی: Escape کردن HTML ==========
    function escapeHtml(text) {
        if (!text) return '';
        return String(text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    // تبدیل متن به نمایش خوانا (با پشتیبانی از code blockهای مارک‌داون)
    function formatMessage(raw) {
        if (!raw) return '';

        // اول کل متن رو escape می‌کنیم تا هیچ HTMLی اجرا نشه
        let safe = escapeHtml(raw);

        // حالا بلوک‌های کد ```...``` رو پیدا می‌کنیم و به <pre><code> تبدیل می‌کنیم
        // این کار بعد از escape انجام می‌شه پس امنه
        safe = safe.replace(/```([\s\S]*?)```/g, function(match, code) {
            return `<pre><code>${code.trim()}</code></pre>`;
        });

        // کدهای اینلاین `code`
        safe = safe.replace(/`([^`]+)`/g, '<code>$1</code>');

        return safe;
    }

    // ساخت حباب پیام
    function createBubble(role, content) {
        const cls = role === 'user' ? 'chat-user' : 'chat-ai';
        const formatted = formatMessage(content);
        return `
            <div class="chat-bubble ${cls}">
                ${formatted}
            </div>`;
    }

    // ========== Auth ==========
    async function auth(action) {
        const u = $('#username').val().trim();
        const p = $('#password').val();
        if (!u || !p) return alert('پر کردن فیلدها الزامی است');

        const res = await fetch('/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action, username: u, password: p })
        });
        const data = await res.json();
        if (data.success) location.reload();
        else alert(data.error || 'خطا');
    }

    // ========== Chat ==========
    function startNewChat() {
        currentConvId = null;
        $('#chatBox').html('<div class="text-center text-muted mt-5">گفتگوی جدید آغاز شد...</div>');
    }

    async function sendMessage() {
        const msg = $('#chatInput').val().trim();
        const fileInput = document.getElementById('chatFile');
        if (!msg && fileInput.files.length === 0) return;

        // حذف پیام خوش‌آمدگویی
        $('#chatBox').find('.text-muted').remove();

        // نمایش پیام کاربر (escape شده)
        $('#chatBox').append(createBubble('user', msg || '[فایل ضمیمه]'));
        $('#chatBox').scrollTop($('#chatBox')[0].scrollHeight);

        const fd = new FormData();
        fd.append('message', msg);
        if (currentConvId) fd.append('conversation_id', currentConvId);
        if (fileInput.files.length > 0) fd.append('file', fileInput.files[0]);

        $('#chatInput').val('');
        $('#chatFile').val('');

        try {
            const res = await fetch('/chat', { method: 'POST', body: fd });
            const data = await res.json();

            if (data.error) {
                alert('خطا: ' + data.error);
                return;
            }

            currentConvId = data.conversation_id;

            // نمایش پاسخ مدل (کاملاً escape شده — هیچ HTMLی رندر نمی‌شود)
            $('#chatBox').append(createBubble('assistant', data.response));
            $('#chatBox').scrollTop($('#chatBox')[0].scrollHeight);

        } catch (e) {
            alert('خطای شبکه یا سرور');
            console.error(e);
        }
    }

    // Enter برای ارسال
    $('#chatInput').on('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // ========== History ==========
    async function loadHistory() {
        const res = await fetch('/history');
        const data = await res.json();
        let html = '';
        (data.conversations || []).forEach(c => {
            html += `
                <div class="history-item" onclick="loadConversation(${c.id})">
                    <strong>${escapeHtml(c.title)}</strong><br>
                    <small class="text-muted">${c.created_at}</small>
                </div>`;
        });
        $('#historyList').html(html || '<div class="text-muted p-3">سابقه‌ای وجود ندارد</div>');
    }

    function searchLive() {
        const val = $('#searchHistory').val().toLowerCase();
        $('.history-item').each(function() {
            $(this).toggle($(this).text().toLowerCase().includes(val));
        });
    }

    async function loadConversation(id) {
        currentConvId = id;
        const res = await fetch(`/conversation/${id}`);
        const data = await res.json();

        let html = '';
        (data.messages || []).forEach(m => {
            html += createBubble(m.role, m.content);
        });

        $('#chatBox').html(html || '<div class="text-muted text-center mt-5">پیامی وجود ندارد</div>');
        $('#chatBox').scrollTop($('#chatBox')[0].scrollHeight);

        // سوئیچ به تب چت
        const tab = new bootstrap.Tab(document.querySelector('#mainTabs a[href="#chatTab"]'));
        tab.show();
    }

    // ========== Settings ==========
    async function loadSettings() {
        const res = await fetch('/settings');
        const data = await res.json();
        if (data) {
            $('#set_api_key').val(data.api_key || '');
            $('#set_model').val(data.model || 'gpt-4o');
            $('#set_memory').val(data.memory || 5);
            $('#set_temp').val(data.temperature || 0.7);
            $('#set_inst').val(data.instruction || '');
            $('#set_base').val(data.base_context || '');
        }
    }

    async function saveSettings() {
        const payload = {
            api_key: $('#set_api_key').val(),
            model: $('#set_model').val(),
            memory: $('#set_memory').val(),
            temperature: $('#set_temp').val(),
            instruction: $('#set_inst').val(),
            base_context: $('#set_base').val()
        };
        const res = await fetch('/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) alert('تنظیمات با موفقیت ذخیره شد.');
        else alert('خطا در ذخیره');
    }
</script>
</body>
</html>
